name: Auto Build Site

# 設定觸發條件：只要有東西推送到 main 分支，就會啟動
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest # 在 GitHub 的虛擬機上執行

    steps:
      - name: 取得最新程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 執行更新腳本
        run: python build_site.py

      - name: 自動存檔與更新 (Auto Commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自動更新：透過 GitHub Actions 執行 build_site.py"
